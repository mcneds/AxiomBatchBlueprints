name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiom-batch-blueprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            minecraft_dependency: '~26.2'
            fabric_api: '0.156.0+26.2'
          - minecraft: '26.1.2'
            minecraft_dependency: '~26.1.2'
            fabric_api: '0.154.2+26.1.2'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Minecraft ${{ matrix.minecraft }}
        run: >-
          gradle --no-daemon clean build
          -Pminecraft_version=${{ matrix.minecraft }}
          -Pminecraft_dependency='${{ matrix.minecraft_dependency }}'
          -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-mc${{ matrix.minecraft }}
          path: |
            build/libs/axiom-batch-blueprints-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: jar-mc*
          path: release-assets
          merge-multiple: true

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$version"

          mc262="$(find release-assets -maxdepth 1 -type f -name "axiom-batch-blueprints-${version}+mc26.2.jar" -print -quit)"
          mc2612="$(find release-assets -maxdepth 1 -type f -name "axiom-batch-blueprints-${version}+mc26.1.2.jar" -print -quit)"
          test -n "$mc262"
          test -n "$mc2612"

          cp "$mc262" release-assets/AxiomBatchBlueprints-latest-mc26.2.jar
          cp "$mc2612" release-assets/AxiomBatchBlueprints-latest-mc26.1.2.jar

          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build \
            release-assets/AxiomBatchBlueprints-latest-mc26.2.jar \
            release-assets/AxiomBatchBlueprints-latest-mc26.1.2.jar \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes "Minecraft 26.2 and 26.1.2"

          tag="v${version}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              "$mc262" \
              "$mc2612" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "Minecraft 26.2 and 26.1.2"
          fi
