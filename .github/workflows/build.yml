name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axiom-batch-blueprints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload mod JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: axiom-batch-blueprints
          path: build/libs/axiom-batch-blueprints-*.jar
          if-no-files-found: error

      - name: Prepare stable release JAR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          jar="$(find build/libs -maxdepth 1 -type f -name 'axiom-batch-blueprints-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          test -n "$jar"
          cp "$jar" build/libs/AxiomBatchBlueprints-latest.jar

      - name: Publish latest development build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build \
            build/libs/AxiomBatchBlueprints-latest.jar \
            --target "$GITHUB_SHA" \
            --title "Latest Development Build" \
            --prerelease \
            --notes "Automatically built from the latest commit on main. This release is replaced on every successful main build."
